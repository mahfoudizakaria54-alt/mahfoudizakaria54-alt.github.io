<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zakaria | موقعي الشخصي</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    text-align:center;
}
header{
    padding:60px 20px;
}
h1{
    color:#ffd700;
    font-size:55px;
    animation: glow 2s infinite alternate;
}
@keyframes glow{
    from{ text-shadow:0 0 10px #ffd700; }
    to{ text-shadow:0 0 25px #ffd700; }
}
.subtitle{
    color:#cbd5e1;
    margin-top:15px;
    font-size:20px;
}
.card{
    background:#1e293b;
    max-width:700px;
    margin:20px auto;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}
h2{
    color:#38bdf8;
    margin-bottom:15px;
}
p{
    line-height:1.8;
}
.btn{
    display:inline-block;
    background:#e1306c;
    color:white;
    text-decoration:none;
    padding:15px 25px;
    border-radius:12px;
    margin-top:20px;
    font-size:18px;
}
.btn:hover{
    background:#ff4f88;
}
footer{
    margin-top:40px;
    padding:20px;
    color:#94a3b8;
}
body.light-mode {
    background: #f5f5f5;
    color: #222;
}
body.light-mode .card {
    background: white;
    color: #222;
}
#themeBtn {
    position: fixed;
    top: 15px;
    right: 15px;
    padding: 10px 14px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 18px;
}
@media (max-width: 600px) {
    .card { width: 90%; margin: 15px auto; box-sizing: border-box; }
    h1 { font-size: 32px; }
    h2 { font-size: 24px; }
    button { max-width: 90%; }
}
button, a {
    transition: transform 0.2s ease;
}
button:active, a:active {
    transform: scale(0.95);
}
.card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.card:active {
    transform: scale(0.98);
}
</style>
</head>
<body>

<button id="themeBtn">☀️</button>

<header>
<h1>👋 مرحباً بك</h1>
<p>أنا زكرياء، مهتم بالتكنولوجيا والبرمجة وصناعة المشاريع الرقمية.</p>
<a href="#about" class="btn">اكتشف المزيد 🚀</a>
<br>
<img src="9a0f2d766603f33634992288085a6911.jpg" alt="صورتي" width="150" style="border-radius: 50%; margin-top:20px;">
</header>

<div class="card" id="about">
<h2>من أنا؟</h2>
<p>
طالب مهتم بالتكنولوجيا الميكانيكية والذكاء الاصطناعي وتطوير المواقع.
هذا أول موقع شخصي أقوم بإنشائه باستخدام HTML و CSS.
</p>
</div>

<div class="card">
<h2>مهاراتي</h2>
<p>
✅ HTML<br>
✅ CSS<br>
✅ Termux<br>
✅ Python
</p>
</div>

<div class="card">
<button onclick="window.open('https://www.instagram.com/za_ki._.oficiel/', '_blank')"
style="background:#E1306C;color:white;padding:10px;border:none;border-radius:8px;cursor:pointer;">

📷 حسابي على إنستغرام
</button>
</div>

<div class="card">
    <h2>عدد الزيارات</h2>
    <p id="visitCount" style="font-size: 30px; color: #38bdf8;"></p>
</div>

<footer>
© 2026 Zakaria
</footer>

<script>
const themeBtn = document.getElementById("themeBtn");
themeBtn.onclick = function() {
    document.body.classList.toggle("light-mode");
    if (document.body.classList.contains("light-mode")) {
        themeBtn.textContent = "🌙";
    } else {
        themeBtn.textContent = "☀️";
    }
};
</script>

<script>
    let count = localStorage.getItem('visits');
    if (count === null) {
        count = 1;
    } else {
        count = parseInt(count) + 1;
    }
    localStorage.setItem('visits', count);
    document.getElementById('visitCount').textContent = count;
</script>

</body>
</html>
